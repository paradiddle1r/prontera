<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Prontera HQ — Command Center</title>
<style>
:root{
  --text:#1d1d1f; --muted:#5f6168; --faint:#8a8d94;
  --accent:#0a84ff; --accent-ink:#fff; --indigo:#5e5ce6;
  --ok:#30a46c; --warn:#e08600; --bad:#e5484d; --okdot:#34c759;
  --radius:18px; --gap:16px;
  --glass:rgba(255,255,255,.52); --glass-2:rgba(255,255,255,.66); --glass-3:rgba(255,255,255,.78);
  --hair:rgba(255,255,255,.6); --line:rgba(60,60,67,.14);
  --shadow:0 10px 34px rgba(20,28,46,.12),0 2px 8px rgba(20,28,46,.07);
  --blur:saturate(180%) blur(24px);
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{display:grid;grid-template-columns:248px 1fr;grid-template-rows:100dvh;
  background:
    radial-gradient(42% 40% at 6% 8%,rgba(10,132,255,.16),transparent 72%),
    radial-gradient(40% 38% at 96% 4%,rgba(94,92,230,.15),transparent 72%),
    radial-gradient(46% 42% at 82% 96%,rgba(255,122,182,.13),transparent 72%),
    radial-gradient(44% 40% at 14% 92%,rgba(48,200,180,.13),transparent 72%),
    radial-gradient(38% 36% at 56% 44%,rgba(255,196,120,.10),transparent 72%),
    radial-gradient(50% 50% at 40% 20%,rgba(120,170,255,.10),transparent 75%),
    linear-gradient(160deg,#f4f6fb,#e9ecf5);
  background-attachment:fixed}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--hair);box-shadow:var(--shadow)}

/* ── sidebar ── */
.side{background:var(--glass-2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 14px;font-weight:600;font-size:16px;letter-spacing:.2px}
.brand .dot{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;box-shadow:0 4px 12px rgba(10,132,255,.4)}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--faint);letter-spacing:.6px}
.nav{display:flex;flex-direction:column;gap:3px;padding:8px 12px;overflow-y:auto;flex:1;min-height:0}
.nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--muted);padding:11px 13px;border-radius:13px;font-size:14.5px;font-weight:500;text-align:left;transition:background .18s,color .18s}
.nav button svg{width:19px;height:19px;flex:0 0 19px}
.nav button:hover{background:rgba(255,255,255,.55);color:var(--text)}
.nav button.on{background:rgba(10,132,255,.14);color:var(--accent)}
.side-foot{padding:13px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}

/* ── main ── */
.main{overflow-y:auto;min-height:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:15px 24px;background:rgba(255,255,255,.5);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--hair)}
.topbar h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.2px}
.topbar .sub{color:var(--muted);font-size:13px}
.topbar .spacer{flex:1}
.tk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:var(--glass-3);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--hair);padding:7px 13px;border-radius:999px;box-shadow:var(--shadow)}
.tk b{color:var(--text);font-weight:600}
.tk .ring{width:9px;height:9px;border-radius:50%;background:var(--okdot)}
.tbtn{display:grid;place-items:center;width:38px;height:38px;border-radius:999px;background:var(--glass-3);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--hair);color:var(--text);box-shadow:var(--shadow);transition:color .15s}
.tbtn:hover{color:var(--accent)}
.tbtn svg{width:18px;height:18px}
#notifBell{position:relative}
.notif-badge{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#ff3b30;color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;box-shadow:0 0 0 2px var(--glass-3)}
.notif-panel{position:fixed;width:340px;max-width:92vw;max-height:min(70vh,480px);display:flex;flex-direction:column;background:var(--glass-3);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow);z-index:230;overflow:hidden;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .16s,transform .16s}
.notif-panel.on{opacity:1;transform:translateY(0);pointer-events:auto}
.notif-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--hair);flex:0 0 auto}
.notif-panel-head b{font-size:13.5px;color:var(--text)}
.notif-mark-all{font:inherit;font-size:12px;color:var(--accent);background:none;border:0;cursor:pointer;padding:2px 4px}
.notif-mark-all:hover{text-decoration:underline}
.notif-list{overflow-y:auto;flex:1;padding:6px}
.notif-item{display:flex;gap:10px;padding:9px 8px;border-radius:10px;align-items:flex-start}
.notif-item.unread{background:rgba(10,132,255,.1)}
.notif-item .ic{font-size:15px;line-height:1.5;flex:0 0 auto}
.notif-item .body{flex:1;min-width:0}
.notif-item .txt{font-size:13px;color:var(--text);word-break:break-word}
.notif-item .ts{font-size:11px;color:var(--muted);margin-top:2px}
.notif-empty{padding:30px 14px;text-align:center;color:var(--muted);font-size:13px}
.wrap{padding:24px;max-width:1180px}
.hd{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin:28px 0 13px}
.hd:first-child{margin-top:6px}

.grid{display:grid;gap:var(--gap)}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.g-cards{grid-template-columns:repeat(auto-fill,minmax(256px,1fr))}
.card,.kpi,.ag,.act,.qi,.ws{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--hair);box-shadow:var(--shadow)}
.card{border-radius:var(--radius);padding:18px}
.kpi{border-radius:var(--radius);padding:16px 18px}
.kpi .l{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .v{font-size:29px;font-weight:700;margin-top:6px;letter-spacing:-1px}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted)}
.kpi svg{width:15px;height:15px;color:var(--accent)}

.ag{border-radius:var(--radius);padding:16px}
.ag-top{display:flex;align-items:center;gap:12px}
.ag-av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;flex:0 0 40px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.ag-nm{font-weight:600;font-size:14.5px}
.ag-rl{font-size:12.5px;color:var(--muted)}
.ag-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:11.5px;font-weight:500;padding:3px 10px;border-radius:999px;background:rgba(120,120,128,.12);color:var(--muted);border:1px solid var(--line)}
.chip.live{background:rgba(48,164,108,.16);color:var(--ok);border-color:rgba(48,164,108,.3)}
.chip.mdl{background:rgba(10,132,255,.13);color:var(--accent);border-color:rgba(10,132,255,.26)}
.chip.mono{font-family:var(--mono);font-size:11px}
.clk{cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.clk:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(20,28,46,.18),0 4px 10px rgba(20,28,46,.1)}

.tkrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tkrow:last-child{border-bottom:0}
.tkrow .nm{width:98px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px}
.tkrow .st{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.bar{flex:1;height:8px;background:rgba(120,120,128,.16);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#0a84ff,#5e5ce6)}
.tkrow .pc{width:74px;text-align:right;font-size:12px;color:var(--muted)}

.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .lbl{flex:1;min-width:150px;font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:10px}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input,select,textarea{background:var(--glass-3);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:9px 11px;font:inherit;font-size:14px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
input[type=time]{padding:8px 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(10,132,255,.2)}
input:disabled{opacity:.4}
.num{width:64px}
.sw{position:relative;width:46px;height:28px;flex:0 0 46px}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw .tr{position:absolute;inset:0;background:rgba(120,120,128,.22);border-radius:999px;transition:.22s}
.sw .tr::after{content:"";position:absolute;left:2px;top:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.28);transition:.22s}
.sw input:checked + .tr{background:var(--okdot)}
.sw input:checked + .tr::after{transform:translateX(18px)}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--glass-3);color:var(--text);border:1px solid var(--hair);border-radius:12px;padding:9px 15px;font-size:13.5px;font-weight:500;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .12s,background .15s;box-shadow:0 2px 8px rgba(20,28,46,.08)}
.btn:hover{background:#fff}
.btn:active{transform:scale(.97)}
.btn svg{width:15px;height:15px}
.btn.run{background:rgba(10,132,255,.14);border-color:rgba(10,132,255,.32);color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent;font-weight:600;box-shadow:0 4px 14px rgba(10,132,255,.36)}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}.faint{color:var(--faint)}.fs12{font-size:12px}.fs13{font-size:13px}
.sub{font-size:12px;color:var(--faint);font-weight:400}
.empty{color:var(--faint);font-size:13.5px;padding:22px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius);background:rgba(255,255,255,.35)}
.flex{display:flex;align-items:center;gap:10px}.wrapflex{flex-wrap:wrap}

.act{border-radius:14px;padding:13px 15px;margin-bottom:11px;border-left:3px solid var(--accent)}
.act.stale{border-left-color:var(--warn);opacity:.78}
.act .ph{font-size:13px;font-weight:600;color:var(--accent)}
.act .who{font-weight:600;text-transform:capitalize}

/* ── pipelines (parallel-work lanes) ── */
.plane{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:var(--gap);align-items:start}
.lane{border-radius:var(--radius);padding:15px}
.lane-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.lane-ag{border-radius:12px;padding:10px 12px;margin-bottom:10px;background:rgba(120,120,128,.08);border:1px solid var(--line)}
.lane-ag:last-child{margin-bottom:0}
.lane-ag.stale{border-color:rgba(224,134,0,.4);opacity:.8}
.lane-ag .who{font-weight:600;text-transform:capitalize;font-size:13px}
.steps{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.step{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(120,120,128,.14);color:var(--faint);white-space:nowrap}
.step.now{background:rgba(10,132,255,.18);color:var(--accent)}
.step.done{background:rgba(48,164,108,.14);color:var(--ok)}

.qi{border-radius:14px;padding:13px 15px;margin-bottom:11px}
.qi .t{font-weight:500;margin:5px 0}
.qi-icb{padding:6px;width:28px;height:28px;flex:0 0 28px;border-radius:9px;justify-content:center}
.qi-icb svg{width:14px;height:14px;margin:0}
.qi-editta{margin-top:2px}
.ws{border-radius:14px;padding:14px 16px;margin-bottom:11px}
.verdict{font-size:11.5px;padding:3px 10px;border-radius:999px;font-weight:600}
.v-ok{background:rgba(48,164,108,.16);color:var(--ok)}
.v-fix{background:rgba(229,72,77,.15);color:var(--bad)}
.v-unclear{background:rgba(224,134,0,.16);color:var(--warn)}

.chatwrap{display:flex;flex-direction:column;height:calc(100dvh - 60px)}
.msgs{flex:1;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:13px}
.msg{max-width:760px;padding:12px 16px;border-radius:20px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;box-shadow:0 2px 10px rgba(20,28,46,.08)}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--glass-3);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--hair);border-bottom-left-radius:6px}
.msg .nm{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600}
.chatbar{display:flex;gap:10px;padding:15px 24px;border-top:1px solid var(--hair);background:rgba(255,255,255,.5);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);align-items:flex-end}
.chatbar select{flex:0 0 auto}.chatbar input{flex:1}

/* Office view — the game world framed in glass so it blends with the dashboard theme (mesh bg shows in the gutter) */
.office{height:calc(100dvh - 60px);width:100%;padding:14px;display:flex}
.office .oframe{flex:1;display:flex;flex-direction:column;border-radius:22px;overflow:hidden;border:1px solid var(--hair);box-shadow:var(--shadow);background:var(--glass-2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.office .ohead{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--text);background:var(--glass-3);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--hair)}
.office .ohead svg{width:16px;height:16px;opacity:.8}
.office iframe{flex:1;width:100%;border:0;background:#070b12;display:block}
.obtn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--text);background:var(--glass-2);border:1px solid var(--hair);padding:5px 11px;border-radius:999px;cursor:pointer;text-decoration:none}
.obtn svg{width:14px;height:14px}
@media (max-width:860px){ .office{height:calc(100dvh - 122px);padding:8px} }
/* Kanban board — งานกำลังทำ / ค้าง / เสร็จ แยกต่อโปรเจค */
.bproj{margin-bottom:26px}
.bph{margin-bottom:11px}
.bpt{font-size:15.5px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pbar{height:6px;background:var(--glass-3);border:1px solid var(--hair);border-radius:999px;overflow:hidden;margin-top:8px;max-width:420px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#5ac8fa);border-radius:999px}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:860px){.kanban{grid-template-columns:1fr}}
.kcol{background:var(--glass-2);border:1px solid var(--hair);border-radius:16px;padding:11px;min-height:76px}
.kcol.doing{border-color:color-mix(in srgb,var(--accent) 45%,var(--hair))}
.kh{font-weight:700;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.kn{background:var(--glass-3);border:1px solid var(--hair);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--text)}
.kcard{background:var(--glass-3);border:1px solid var(--hair);border-radius:12px;padding:9px 11px;margin-bottom:8px;box-shadow:var(--shadow)}
.kcard:last-child{margin-bottom:0}
.kcard.live{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.kcard.done{opacity:.8}
.kcard[role="button"]{cursor:pointer;transition:border-color .15s,transform .1s}
.kcard[role="button"]:hover{border-color:var(--accent)}
.kcard[role="button"]:active{transform:scale(.99)}
.kcard[role="button"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kt{font-size:13px;font-weight:550;line-height:1.36;margin-bottom:6px;word-break:break-word}
.km{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kmeta{font-size:11px;color:var(--muted)}
.kempty{color:var(--faint);font-size:12px;padding:10px 6px;text-align:center}
.chip.sm{font-size:10.5px;padding:1px 7px}
.chip.warn{background:rgba(255,159,10,.16);color:#c77700;border-color:rgba(255,159,10,.3)}
.btn.sm{padding:5px 10px;font-size:12px}
.seg{display:inline-flex;gap:4px;background:var(--glass-2);border:1px solid var(--hair);border-radius:13px;padding:4px}
.seg button{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:550;padding:7px 15px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--glass-3);color:var(--text);box-shadow:var(--shadow)}
@media(max-width:860px){.seg{width:100%;overflow-x:auto}}
.agpick{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--glass-2);border:1px solid var(--hair);padding:5px 11px;border-radius:10px;cursor:pointer}
.agpick input{margin:0}
@media (max-width:860px){ .office{height:calc(100dvh - 122px);padding:8px} }

/* ── Task Assignment Hub — "New Task" modal, modeled on the cmdk/agmem overlay pattern ── */
.taskm-overlay{position:fixed;inset:0;z-index:220;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,14,24,.42);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.taskm-overlay.on{display:flex}
.taskm-modal{position:relative;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;border-radius:22px;padding:22px;background:var(--glass-3);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid rgba(10,132,255,.28);box-shadow:0 24px 70px rgba(10,132,255,.16),0 8px 26px rgba(0,0,0,.32)}
.taskm-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--glass-3);border:1px solid var(--hair);display:grid;place-items:center;color:var(--muted);font-size:14px;line-height:1;box-shadow:var(--shadow)}
.taskm-close:hover{color:var(--accent)}
.taskm-modal .hd{margin:0 0 14px}
.taskm-fld{margin-bottom:11px}
.taskm-fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.taskm-fld select,.taskm-fld input,.taskm-fld textarea{width:100%}

.page{display:none}.page.on{display:block}

.mtop{display:none}
@media (max-width:860px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .side{display:none}
  .mtop{display:flex;align-items:center;gap:10px;padding:13px 16px;background:var(--glass-2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:30}
  .mtop .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);display:grid;place-items:center;color:#fff;font-weight:700}
  .mtop b{font-size:15px}
  .topbar{padding:13px 16px}.topbar h1{font-size:17px}
  .wrap{padding:16px}
  .mnav{display:flex;position:sticky;bottom:0;z-index:30;background:var(--glass-2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-top:1px solid var(--hair);padding:6px 6px 8px;gap:2px;overflow-x:auto;scrollbar-width:none}
  .mnav::-webkit-scrollbar{display:none}

/* ── command palette (⌘K) ── */

.agmem-overlay{position:fixed;inset:0;z-index:210;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,14,24,.42);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}

<script>
const KEY=(function(){try{const u=new URLSearchParams(location.search).get("key");if(u)localStorage.setItem("prontera_gkey",u);return u||localStorage.getItem("prontera_gkey")||"";}catch(_){return"";}})();
const LOCAL=["localhost","127.0.0.1",""];
const BACKEND=(location.protocol==="file:"||LOCAL.includes(location.hostname))?"":"https://pornchais-mac-mini.tail62b220.ts.net:8443";
const CEORE=/\/(set_model|set_schedule|set_project_cron|run_project|queue_add|queue_remove|roadmap_set|roadmap_clear|roadmap_auto|project_create|no_claude|brief|agent|iris_run|vera_run)(\?|$)/;
function url(p){ if(KEY&&CEORE.test(p)&&p.indexOf("key=")<0) p+=(p.indexOf("?")>=0?"&":"?")+"key="+encodeURIComponent(KEY); return BACKEND+p; }
async function getJSON(p){ try{const r=await fetch(url(p));return r.ok?await r.json():null;}catch(_){return null;} }
async function postJSON(p,body){ try{const r=await fetch(url(p),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});return r.ok?await r.json().catch(()=>({ok:true})):null;}catch(_){return null;} }
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function avColor(s){const h=[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%360;return"linear-gradient(135deg,hsl("+h+",70%,58%),hsl("+((h+40)%360)+",70%,52%))";}
const fmtK=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+"M":n>=1e3?Math.round(n/1e3)+"k":""+Math.round(n);

const ICON={
  overview:'<path d="M3 13h8V3H3zM13 21h8V3h-8zM3 21h8v-6H3z"/>',
  projects:'<path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7"/>',
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  pipelines:'<rect x="3" y="4" width="5" height="16" rx="1.5" fill="none"/><rect x="10" y="9" width="5" height="11" rx="1.5" fill="none"/><rect x="17" y="13" width="5" height="7" rx="1.5" fill="none"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  models:'<path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/>',
  work:'<path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  invest:'<path d="M3 3v18h18M7 14l4-4 4 4 5-6"/>',
  office:'<path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-3M9 9v.01M9 13v.01M9 17v.01"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  play:'<path d="M5 3l14 9-14 9z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>',
  bolt:'<path d="M13 2L3 14h9l-1 8 10-12h-9z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.3 1 2.1V16h6v-.4c0-.8.4-1.5 1-2.1A6 6 0 0 0 12 3z"/>'
};
function ic(n,c){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'+(c?' style="color:'+c+'"':'')+' aria-hidden="true">'+(ICON[n]||"")+'</svg>';}

const NAV=[
  ["overview","ภาพรวม","overview"],
  ["board","บอร์ดงาน","work"],
  ["projects","โปรเจค","projects"],
  ["chat","แชท","chat"],
  ["team","ทีม & โมเดล","models"],
  ["invest","การลงทุน","invest"],
  ["office","Office view","office"]
];
// Folded into Board / the Team tab / ⌘K palette — reachable, just not cluttering the main nav.
const NAV_HIDDEN=[
  ["activity","Live Activity","activity"],["pipelines","งานคู่ขนาน","pipelines"],
  ["work","สรุปงานรายวัน","work"],["recall","ความต่อเนื่อง & เซสชัน","work"],
  ["skills","สกิล (เรียนรู้)","bulb"],["profile","โปรไฟล์เจ้าของ","overview"],
  ["models","โมเดล & Token","models"],["search","ค้นหาประวัติงาน","search"]
];
const MNAV=NAV.map(function(n){return n[0];});   // mobile bottom-nav: all tabs, horizontally scrollable
let CUR="overview";
function buildNav(){
  document.getElementById("nav").innerHTML=NAV.map(n=>'<button data-v="'+n[0]+'">'+ic(n[2])+'<span>'+n[1]+'</span></button>').join("");
  document.getElementById("mnav").innerHTML=MNAV.map(v=>{const n=NAV.find(x=>x[0]===v);return '<button data-v="'+v+'">'+ic(n[2])+'<span>'+n[1].split(" ")[0]+'</span></button>';}).join("");
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>go(b.dataset.v));
}
function go(v){
  CUR=v;
  document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  const n=NAV.find(x=>x[0]===v)||NAV_HIDDEN.find(x=>x[0]===v)||NAV[0];
  document.getElementById("ttl").textContent=n[1];
  const R={overview:renderOverview,board:renderBoard,projects:renderProjects,activity:renderActivity,pipelines:renderPipelines,chat:renderChat,search:renderSearch,recall:renderRecall,skills:renderSkills,profile:renderProfile,team:renderTeam,models:renderModels,work:renderWork,invest:renderInvest,office:renderOffice};
  (R[v]||renderOverview)();
}
const V=()=>document.getElementById("view");

async function refreshTokens(){
  const d=await getJSON("/limits"); const foot=document.getElementById("foot");
  if(!d){ document.getElementById("tktxt").textContent="offline"; document.getElementById("tkring").style.background="var(--bad)"; foot.textContent="⚠ เชื่อมต่อ backend ไม่ได้"; return; }
  const c=d.claude||{}; const pc=c.limit?Math.round(100*c.remaining/c.limit):0;
  document.getElementById("tktxt").innerHTML="Claude <b>"+pc+"%</b>";
  document.getElementById("mtk").textContent="Claude "+pc+"%";
  document.getElementById("tkring").style.background=pc>20?"var(--okdot)":pc>0?"var(--warn)":"var(--bad)";
  const live=Object.values(d).filter(b=>!b.exhausted).length;
  foot.innerHTML="● "+live+"/"+Object.keys(d).length+" backends ออนไลน์";
  return d;
}

async function renderOverview(){
  V().innerHTML='<div class="wrap"><div class="grid g-kpi" id="kpi"></div><div class="hd">ทีม (agents)</div><div class="grid g-cards" id="rost"><div class="empty">กำลังโหลด…</div></div><div class="hd">Token / Mana</div><div class="card" id="tok"></div></div>';
  const [dash,act,lim]=await Promise.all([getJSON("/dashboard"),getJSON("/activity"),getJSON("/limits")]);
  const agents=(dash&&dash.agents)||[]; const working=act&&typeof act==="object"?act:{};
  const nWork=Object.keys(working).length;
  const kpi=[["agents ทั้งหมด",agents.length,"overview"],["กำลังทำงาน",nWork,"activity"],["งานสะสม (tickets)",(dash&&dash.ticketCount)||0,"work"],["backends ออนไลน์",lim?Object.values(lim).filter(b=>!b.exhausted).length:"–","models"]];
  document.getElementById("kpi").innerHTML=kpi.map(k=>'<div class="kpi"><div class="l">'+ic(k[2])+esc(k[0])+'</div><div class="v">'+k[1]+'</div></div>').join("");
  const busy={}; Object.values(working).forEach(a=>{if(a.agent)busy[a.agent]=a.phase;});
  document.getElementById("rost").innerHTML=agents.map(a=>{
    const ph=busy[a.id];
    return '<div class="ag clk" data-agent="'+esc(a.id)+'" title="ดูความจำ/สกิลของ '+esc(a.name||a.id)+'"><div class="ag-top"><div class="ag-av" style="background:'+avColor(a.id)+'">'+esc((a.name||a.id)[0].toUpperCase())+'</div><div><div class="ag-nm">'+esc(a.name||a.id)+'</div><div class="ag-rl">'+esc(a.role||"")+'</div></div></div><div class="ag-meta"><span class="chip mdl">'+esc(a.backend||"claude")+(a.model?" · "+esc(a.model):"")+'</span>'+(ph?'<span class="chip live">● '+esc(ph)+'</span>':'')+'<span class="chip">'+(a.tickets||0)+' งาน</span></div></div>';
  }).join("")||'<div class="empty">ไม่มีข้อมูล agent</div>';
  document.getElementById("rost").querySelectorAll("[data-agent]").forEach(function(el){ el.onclick=function(){ openAgentMemory(el.dataset.agent); }; });
  renderTokBars(document.getElementById("tok"),lim);

function renderTokBars(box,lim){

// ── Global background activity poller — always-on, independent of CUR/tab, reuses /activity so toast()
// fires on real state transitions (finish/reviewing/stale) even while the user sits on Overview/Chat/Models.
let bgActSeen=null; // module-level lastSeen snapshot: {agentId:{phase,updated_at,project,stale}} — null until first poll
async function pollActivityGlobal(){
  const d=await getJSON("/activity")||{};
  const now={};
  Object.keys(d).forEach(k=>{
    const a=d[k]||{};
    let stale=false; try{stale=(Date.now()-Date.parse(a.updated_at))>180000;}catch(_){}
    now[k]={phase:a.phase,updated_at:a.updated_at,project:a.project,stale:stale};
  });
  if(!bgActSeen){ bgActSeen=now; return; } // first poll: seed silently, no toasts (avoid spam on page open)
  Object.keys(bgActSeen).forEach(k=>{
    if(!now[k]){
      const prev=bgActSeen[k];
      toast("✓ "+k+" เสร็จงานแล้ว ("+(prev.project||"-")+")");
    }
  });
  Object.keys(now).forEach(k=>{
    const cur=now[k], prev=bgActSeen[k];
    if(!prev) return; // brand-new agent id this poll — no prior state to diff a transition against
    if(cur.phase==="reviewing"&&prev.phase!=="reviewing") toast("👀 Vera กำลังรีวิว "+k);
    if(cur.stale&&!prev.stale) toast("⚠ "+k+" ค้าง/ไม่ตอบสนอง ("+(cur.project||"-")+")");
  });
  bgActSeen=now;
}

// swimlanes so concurrent runs across rooms are visible at a glance, each agent shown with a phase stepper.
let plTimer=null;
const PL_STAGES=[["planning","วางแผน"],["working","เขียนโค้ด"],["reviewing","รีวิว"],["waiting for CI","รอ CI"]];
async function renderPipelines(){
  V().innerHTML='<div class="wrap">'
    +'<!-- /pipeline_status endpoint needed — ideal shape: [{project, stages:[{key,label,agents:[{agent,detail,started_at}]}], updated_at}] -->'
    +'<div class="hd">งานคู่ขนานตามโปรเจค <span class="sub">— จัดกลุ่ม /activity ตามโปรเจค แต่ละคอลัมน์ = 1 โปรเจค ที่กำลังมี agent ทำงานอยู่ · อัปเดตทุก 5 วิ</span></div><div id="plbox" class="plane"><div class="empty">กำลังโหลด…</div></div></div>';
  loadPipelines(); if(plTimer)clearInterval(plTimer); plTimer=setInterval(()=>{if(CUR==="pipelines")loadPipelines();else{clearInterval(plTimer);plTimer=null;}},5000);
}
async function loadPipelines(){
  const box=document.getElementById("plbox"); if(!box)return;
  // /pipeline_status endpoint not implemented yet — ideal future shape:
  // [{project, stages:[{key,label,agents:[{agent,detail,started_at}]}], updated_at}]
  // Until that exists, lanes below are derived client-side by grouping the same /activity payload
  // (keyed by agent: {project,phase,detail,started_at,updated_at}) BY a.project.
  const d=await getJSON("/activity")||{};
  const ks=Object.keys(d);
  const byProj={};
  ks.forEach(k=>{
    const a=d[k]||{}; const p=a.project||"(ไม่ระบุโปรเจค)";
    (byProj[p]=byProj[p]||[]).push(Object.assign({who:k},a));
  });
  const projects=Object.keys(byProj).sort();
  if(!projects.length){ box.innerHTML='<div class="empty">😴 ตอนนี้ไม่มีโปรเจคที่กำลังรันคู่ขนาน — จะขึ้นเป็นคอลัมน์ทันทีที่มี agent ทำงาน</div>'; return; }
  box.innerHTML=projects.map(p=>{
    const agents=byProj[p];
    const rows=agents.map(a=>{
      let stale=false; try{stale=(Date.now()-Date.parse(a.updated_at))>180000;}catch(_){}
      const curIdx=PL_STAGES.findIndex(s=>s[0]===a.phase);
      const steps=PL_STAGES.map(([key,label],i)=>{
        const cls=key===a.phase?"step now":(curIdx>=0&&i<curIdx?"step done":"step");
        return '<span class="'+cls+'">'+esc(label)+'</span>';
      }).join("");
      return '<div class="lane-ag'+(stale?" stale":"")+'"><div class="flex wrapflex"><span class="who">'+esc(a.agent||a.who)+'</span>'+(a.agent&&a.agent!==a.who?'<span class="chip">'+esc(a.who)+'</span>':'')+'</div>'
        +(a.detail?'<div class="t" style="margin:5px 0 0;font-size:12.5px">'+esc(a.detail)+'</div>':'')
        +'<div class="steps">'+steps+'</div>'
        +'<div class="sub" style="margin-top:6px">เริ่ม '+esc(String(a.started_at||"").replace("T"," "))+(stale?' · อาจค้าง':'')+'</div></div>';
    }).join("");
    return '<div class="card lane"><div class="lane-hd"><span class="chip mdl">'+esc(p)+'</span><span class="sub" style="margin-left:auto">'+agents.length+' agent'+(agents.length>1?"s":"")+' กำลังทำงาน</span></div>'+rows+'</div>';

function addMsg(cls,who,txt){const m=document.getElementById("msgs");if(m.querySelector(".empty"))m.innerHTML="";const d=document.createElement("div");d.className="msg "+cls;d.innerHTML=(who?'<div class="nm">'+esc(who)+'</div>':'')+esc(txt);m.appendChild(d);m.scrollTop=m.scrollHeight;updateContextMeter();}
function updateContextMeter(){
  const m=document.getElementById("msgs");if(!m)return;
  const kids=[...m.children].filter(c=>!c.classList.contains("empty"));

}

          +(s.summary?'<div class="t" style="margin-top:6px">'+esc(s.summary)+'</div>':'<div class="muted fs13" style="margin-top:6px">(ไม่มีสรุป)</div>')+'</div>';

// Best-effort fallback while /recent_sessions doesn't exist yet: reuse /history_search (empty query,
// most-recent items) as a proxy for "recent sessions"; if that's also unavailable/empty, fall back
// further to /activity so the view still shows something. Neither source has real continuesFrom data,
// so continuity badges will only appear once /recent_sessions ships.
async function deriveRecentSessions(){
  const hs=await getJSON("/history_search?q=&limit=20");
  if(Array.isArray(hs)&&hs.length){
    return hs.map(function(r,i){
      return {
        agent:r.agent||r.agentName||"?",
        agentName:r.agentName||r.agent||"?",
        sessionId:r.sessionId||r.id||("hs-"+i),
        startedAt:r.when||r.started_at||r.startedAt||"",
        endedAt:r.ended_at||r.endedAt||"",
        summary:r.title||r.snippet||"",
        continuesFrom:r.continuesFrom||null
      };
    });
  }
  const act=await getJSON("/activity")||{};
  const ks=Object.keys(act);
  if(!ks.length) return [];
  return ks.map(function(k){
    const a=act[k]||{};
    return {
      agent:a.agent||k,
      agentName:a.agent||k,
      sessionId:k+"-"+(a.started_at||""),
      startedAt:a.started_at||"",
      endedAt:"",
      summary:a.detail||a.phase||"",
      continuesFrom:null
    };
  });
}

function wireSkillRows(container,onChanged){
  container.querySelectorAll(".qi[data-name]").forEach(function(row){
    const aid=row.dataset.agent, name=row.dataset.name;
    const editBtn=row.querySelector("[data-skedit]"), delBtn=row.querySelector("[data-skdel]");
    const editbox=row.querySelector(".qi-editbox"), bodyEl=row.querySelector(".qi-body");
    const msg=row.querySelector(".qi-msg"), saveBtn=row.querySelector(".qi-savebtn"), cancelBtn=row.querySelector(".qi-cancelbtn"), ta=row.querySelector(".qi-editta");
    if(editBtn) editBtn.onclick=function(e){
      e.stopPropagation();
      const opening=editbox.style.display==="none";
      editbox.style.display=opening?"block":"none";
      if(bodyEl) bodyEl.style.display=opening?"none":"";
      if(opening&&ta) ta.focus();
    };
    if(cancelBtn) cancelBtn.onclick=function(e){ e.stopPropagation(); editbox.style.display="none"; if(bodyEl) bodyEl.style.display=""; };
    if(saveBtn) saveBtn.onclick=async function(e){
      e.stopPropagation();
      const newBody=(ta.value||"").trim();
      if(msg) msg.textContent="กำลังบันทึก…";
      // NOTE: overwriting-by-name assumes the backend upserts a skill keyed on (agent,name) — i.e.
      // POSTing the same name again replaces the existing body instead of appending a duplicate row.
      // /skills and /agent_memory may need server-side support for this upsert semantic.
      let r=await postJSON("/skills",{agent:aid,name:name,body:newBody});
      if(!r) r=await postJSON("/agent_memory",{agent:aid,name:name,note:newBody});
      if(r){ toast("แก้ไขสกิลแล้ว"); onChanged(); }
      else if(msg){ msg.textContent="✕ บันทึกไม่สำเร็จ (endpoint ยังไม่พร้อม)"; }
    };
    if(delBtn) delBtn.onclick=async function(e){
      e.stopPropagation();
      if(msg) msg.textContent="กำลังลบ…";
      let r=await postJSON("/skill_remove",{agent:aid,name:name});
      if(!r) r=await postJSON("/skills_remove",{agent:aid,name:name});
      if(r){ toast("ลบสกิลแล้ว"); onChanged(); }
      else if(msg){ msg.textContent="✕ ลบไม่สำเร็จ (endpoint ยังไม่พร้อม)"; }
    };
  });
}

/* Kanban board — the team's work grouped กำลังทำ / ค้าง / เสร็จ, แยกต่อโปรเจค (feeds /board) */
function _pushBoardTask(t){
  if(!window._boardTasks) window._boardTasks=[];
  window._boardTasks.push(t);
  return window._boardTasks.length-1;
}
function _kcard(title,agent,meta,cls,idx){
  const clickAttrs=idx==null?"":' data-idx="'+idx+'" role="button" tabindex="0"';
  return '<div class="kcard '+(cls||"")+'"'+clickAttrs+'><div class="kt">'+esc(title||"(ไม่มีชื่อ)")+'</div><div class="km">'+(agent?'<span class="chip sm">'+esc(agent)+'</span>':'')+(meta?'<span class="kmeta">'+esc(meta)+'</span>':'')+'</div></div>';
}
function _kcol(title,cls,items,emptyTxt){
  return '<div class="kcol '+cls+'"><div class="kh"><span>'+esc(title)+'</span><span class="kn">'+items.length+'</span></div>'+(items.length?items.join(""):'<div class="kempty">'+esc(emptyTxt)+'</div>')+'</div>';
}
function _boardProject(p,v){
  const rm=v.roadmap, pct=rm&&rm.total?Math.round(100*rm.done/rm.total):0;
  const head='<div class="bph"><div class="bpt">'+esc(p)+(rm?'<span class="chip">🎯 '+esc(rm.title)+' · '+rm.done+'/'+rm.total+(rm.by==="iris"?' · โดย Iris':'')+'</span>':'<span class="chip warn">ยังไม่มีเป้าหมาย — Iris จะตั้งให้รอบถัดไป</span>')+'</div>'+(rm?'<div class="pbar"><i style="width:'+pct+'%"></i></div>':'')+'</div>';
  const doing=[];
  /* m3: v.doing may be a single task object (legacy/current) or an array of task objects
     (future shape for concurrent work) — normalize to a list and render one live card each */
  const doingList=Array.isArray(v.doing)?v.doing:(v.doing?[v.doing]:[]);
  doingList.forEach(dt=>{
    const idx=_pushBoardTask(Object.assign({},dt,{project:p,status:"กำลังทำ"}));
    doing.push(_kcard(dt.title,dt.agent,"● "+(dt.phase||"ทำงาน"),"live",idx));
  });
  const pend=(v.pending||[]).map(t=>{
    const idx=_pushBoardTask(Object.assign({},t,{project:p,status:"ค้างอยู่"}));
    return _kcard(t.title,t.agent,t.ms?("milestone "+t.ms):(t.model||""),"",idx);
  });
  const done=(v.done||[]).map(t=>{
    const idx=_pushBoardTask(Object.assign({},t,{project:p,status:"เสร็จ"}));
    return _kcard(t.title,t.agent,(t.verdict?("✓ "+t.verdict):"")+(t.commit?(" · "+t.commit):""),"done",idx);
  });
  return '<div class="bproj">'+head+'<div class="kanban">'
    +_kcol("กำลังทำ"+(doingList.length>1?' ⚡ '+doingList.length+' พร้อมกัน':""),"doing",doing,"ทีมว่างอยู่")
    +_kcol("ค้างอยู่ (backlog)","pending",pend,"ไม่มีงานค้าง")
    +_kcol("เสร็จล่าสุด","done",done,"ยังไม่มี")+'</div></div>';
}

/* m2 (Task Control Center): action-bar handlers for the drawer opened above. Reuses the existing
   getJSON/postJSON helpers and .btn/.chip/.taskm-fld CSS — no new design language. Cancel hits the
   real /queue_remove endpoint (same call the queue-list delete button at loadQ() uses); Retry and
   Reassign POST to endpoints that don't exist server-side yet, so a null/404 response is treated as

/* m3 (Diff Preview): renders the per-file list returned by /task_diff — {files:[{path,additions,
   deletions,patch}]}. Each file row is independently collapsible; patch text gets simple line-based
   +/- coloring via var(--ok)/var(--bad), no syntax-highlighter dependency. */
function _renderDiffPatch(patch){
  return String(patch||"").split("\n").map(function(line){
    var style="";
    if(line.charAt(0)==="+") style="background:rgba(48,164,108,.12);color:var(--ok)";
    else if(line.charAt(0)==="-") style="background:rgba(229,72,77,.12);color:var(--bad)";
    return '<span style="display:block;padding:0 6px;'+style+'">'+esc(line.length?line:" ")+'</span>';
  }).join("");
}
function _renderDiffFiles(files){
  if(!Array.isArray(files)||!files.length) return '<div class="empty">ไม่มีไฟล์ที่เปลี่ยนแปลง</div>';
  return files.map(function(f,i){
    const add=f.additions!=null?f.additions:0, del=f.deletions!=null?f.deletions:0;
    return '<div class="card" style="padding:0;margin-bottom:8px;overflow:hidden">'
      +'<div class="tdDiffFileHd" data-difffile="'+i+'" role="button" tabindex="0" style="display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer">'
        +'<span class="mono" style="flex:1;font-size:12.5px;word-break:break-all">'+esc(f.path||"(unknown)")+'</span>'
        +'<span class="chip" style="color:var(--ok);border-color:var(--ok)">+'+add+'</span>'
        +'<span class="chip" style="color:var(--bad);border-color:var(--bad)">-'+del+'</span>'
        +'<span data-chev="'+i+'" style="display:inline-block;transition:transform .15s;color:var(--faint)">▾</span>'
      +'</div>'
      +'<div data-diffpatch="'+i+'" style="display:none;border-top:1px solid var(--line)">'
        +'<pre class="mono" style="margin:0;padding:10px 0;font-size:12px;line-height:1.55;overflow-x:auto;white-space:pre">'+_renderDiffPatch(f.patch)+'</pre>'
      +'</div>'
    +'</div>';
  }).join("");
}
function _wireTaskDetailActions(t){
  const msg=document.getElementById("tdActionMsg");

  const diffToggle=document.getElementById("tdDiffToggle"), diffBody=document.getElementById("tdDiffBody");
  if(diffToggle&&diffBody){
    let diffLoaded=false;
    diffToggle.onclick=async function(){
      const chev=document.getElementById("tdDiffChevron");
      const opening=diffBody.style.display==="none";
      if(!opening){ diffBody.style.display="none"; diffToggle.setAttribute("aria-expanded","false"); if(chev) chev.style.transform="rotate(0deg)"; return; }
      diffBody.style.display="block"; diffToggle.setAttribute("aria-expanded","true"); if(chev) chev.style.transform="rotate(180deg)";
      if(diffLoaded) return;
      diffLoaded=true;
      diffBody.innerHTML='<div class="empty">กำลังโหลด diff…</div>';
      const r=await getJSON("/task_diff?id="+encodeURIComponent(t.id));
      if(r&&Array.isArray(r.files)){
        diffBody.innerHTML=_renderDiffFiles(r.files);
        diffBody.querySelectorAll("[data-difffile]").forEach(function(h){
          const toggleFile=function(){
            const idx=h.dataset.difffile;
            const patchEl=diffBody.querySelector('[data-diffpatch="'+idx+'"]');
            const chevEl=diffBody.querySelector('[data-chev="'+idx+'"]');
            if(!patchEl) return;
            const openFile=patchEl.style.display==="none";
            patchEl.style.display=openFile?"block":"none";
            if(chevEl) chevEl.style.transform=openFile?"rotate(180deg)":"rotate(0deg)";
          };
          h.onclick=toggleFile;
          h.onkeydown=function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggleFile(); } };
        });
      } else {
        diffBody.innerHTML='<div class="empty">ยังไม่มี backend endpoint /task_diff — UI พร้อมใช้เมื่อ backend เพิ่ม endpoint นี้</div>';

    const r=await postJSON("/task_retry",{id:t.id});
    retryBtn.disabled=false;
    if(r){ msg.textContent="✓ ส่งคำสั่งลองใหม่แล้ว"; toast("✓ ลองใหม่: "+(t.title||t.id)); if(boardReload) boardReload(); }
    else { msg.textContent="ยังไม่มี backend endpoint /task_retry — UI พร้อมใช้เมื่อ backend เพิ่ม endpoint นี้"; toast("ยังไม่มี backend endpoint /task_retry"); }
  };
  const reassignBtn=document.getElementById("tdReassign"), box=document.getElementById("tdReassignBox");
  if(reassignBtn) reassignBtn.onclick=function(){
    if(box.style.display==="none"||!box.innerHTML){

        const r=await postJSON("/task_reassign",{id:t.id,agent:newAgent});
        submitBtn.disabled=false;

        else { msg.textContent="ยังไม่มี backend endpoint /task_reassign — UI พร้อมใช้เมื่อ backend เพิ่ม endpoint นี้"; toast("ยังไม่มี backend endpoint /task_reassign"); }

function taskmAgentOptions(projName){
  const meta=PROJMETA.find(p=>p.name===projName)||{};
  let ids=meta.agents;
  if(typeof ids==="string") ids=ids.split(",").map(s=>s.trim()).filter(Boolean);
  if(!Array.isArray(ids)||!ids.length) ids=AG.filter(a=>["iris","vera","openclaw"].indexOf(a[0])<0).map(a=>a[0]);
  return ids.map(function(id){ const a=AG.find(x=>x[0]===id); return [id,(a?a[1]:id)]; });
}
function taskmRefreshAgents(){
  const projSel=document.getElementById("taProj"), agentSel=document.getElementById("taAgent");
  if(!projSel||!agentSel) return;
  const opts=taskmAgentOptions(projSel.value);
  agentSel.innerHTML=opts.map(o=>'<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>').join("")||'<option value="">(ไม่มี agent)</option>';
}
async function openTaskModal(){
  await loadProjects();
  const ov=document.getElementById("taskmOverlay"); if(!ov) return;
  const projSel=document.getElementById("taProj");
  projSel.innerHTML=PROJ.map(p=>'<option value="'+esc(p[0])+'">'+esc(p[0])+'</option>').join("");
  projSel.onchange=taskmRefreshAgents;
  taskmRefreshAgents();
  document.getElementById("taPriority").value="med";
  document.getElementById("taDue").value="";
  document.getElementById("taTitle").value="";
  document.getElementById("taMsg").textContent="";
  ov.classList.add("on");
  setTimeout(function(){ const t=document.getElementById("taTitle"); if(t) t.focus(); },0);
}
function closeTaskModal(){ const ov=document.getElementById("taskmOverlay"); if(ov) ov.classList.remove("on"); }
async function submitTaskModal(){
  const proj=document.getElementById("taProj").value, agent=document.getElementById("taAgent").value,
    priority=document.getElementById("taPriority").value, due=document.getElementById("taDue").value,
    title=document.getElementById("taTitle").value.trim(), msg=document.getElementById("taMsg"), btn=document.getElementById("taSubmit");
  if(!proj||!agent||!title){ msg.textContent="กรอกโปรเจค, agent และหัวข้องานก่อน"; return; }
  btn.disabled=true; msg.textContent="กำลังสร้าง…";
  const r=await getJSON("/queue_add?name="+encodeURIComponent(title)+"&project="+encodeURIComponent(proj)+"&agent="+encodeURIComponent(agent)+"&priority="+encodeURIComponent(priority)+"&due="+encodeURIComponent(due)+"&title="+encodeURIComponent(title));
  btn.disabled=false;
  if(r&&r.ok){
    closeTaskModal();
    toast("✓ เพิ่มงานใหม่: "+title);
    if(boardReload) boardReload(); else if(CUR==="board") renderBoard();
  } else {
    msg.textContent="✕ "+((r&&(r.error||r.message))||"สร้างงานไม่สำเร็จ");
  }
}
document.getElementById("taskmClose").onclick=closeTaskModal;
document.getElementById("taskmOverlay").addEventListener("mousedown",function(e){ if(e.target.id==="taskmOverlay") closeTaskModal(); });
document.getElementById("taSubmit").onclick=submitTaskModal;
document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ const ov=document.getElementById("taskmOverlay"); if(ov&&ov.classList.contains("on")) closeTaskModal(); } });

function renderOffice(){
  V().innerHTML='<div class="office"><div class="oframe">'
    +'<div class="ohead">'+ic("office")+'<span>Prontera Office — โลกเกม</span><span class="spacer"></span>'
    +'<button class="obtn" id="orl" title="รีเฟรช">'+ic("refresh")+'รีเฟรช</button>'
    +'<a class="obtn" href="prontera-v2.html" target="_blank" rel="noopener">เปิดเต็มหน้า ↗</a></div>'
    +'<iframe id="ofr" src="prontera-v2.html" title="Prontera office (game world)"></iframe></div></div>';
  const f=document.getElementById("ofr");
  const kick=()=>{try{f.contentWindow.dispatchEvent(new Event("resize"));}catch(_){}};
  f.onload=()=>{ kick(); setTimeout(kick,500); setTimeout(kick,1500); };
  const rl=document.getElementById("orl"); if(rl) rl.onclick=()=>{ const s=f.src; f.src=s; };
}

/* ── Notification bell: in-memory + localStorage history of every toast() ─────────────────────────
   Every toast() call also records an entry here (icon derived from its leading glyph, newest first,
   capped to last NOTIF_CAP). toast() itself is untouched as the transient popup. */
const NOTIF_KEY="prontera_notifications", NOTIF_CAP=50;
let notifStore=[];
try{ notifStore=JSON.parse(localStorage.getItem(NOTIF_KEY)||"[]"); if(!Array.isArray(notifStore)) notifStore=[]; }catch(_){ notifStore=[]; }
function notifSave(){ try{ localStorage.setItem(NOTIF_KEY,JSON.stringify(notifStore.slice(0,NOTIF_CAP))); }catch(_){} }
function notifIcon(t){
  t=String(t||"");
  if(t.indexOf("✓")===0) return "✓";
  if(t.indexOf("⚠")===0) return "⚠";
  if(t.indexOf("👀")===0) return "👀";
  if(t.indexOf("▶")===0) return "▶";
  if(t.indexOf("✗")===0) return "✗";
  return "🔔";
}
function notifAdd(text){
  notifStore.unshift({id:Date.now()+"_"+Math.random().toString(36).slice(2,7),text:String(text),icon:notifIcon(text),ts:Date.now(),read:false});
  if(notifStore.length>NOTIF_CAP) notifStore.length=NOTIF_CAP;
  notifSave();
  notifRenderBadge();
  const panel=document.getElementById("notifPanel");
  if(panel&&panel.classList.contains("on")) notifRenderList();
}
function notifUnreadCount(){ return notifStore.reduce((n,x)=>n+(x.read?0:1),0); }
function notifRenderBadge(){
  const b=document.getElementById("notifBadge"); if(!b) return;
  const c=notifUnreadCount();
  if(c>0){ b.textContent=c>99?"99+":String(c); b.style.display="block"; } else { b.style.display="none"; }
}
function notifFmtTs(ts){
  try{ return new Date(ts).toLocaleString("th-TH",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }catch(_){ return ""; }
}
function notifRenderList(){
  const list=document.getElementById("notifList"); if(!list) return;
  if(!notifStore.length){ list.innerHTML='<div class="notif-empty">ยังไม่มีการแจ้งเตือน</div>'; return; }
  list.innerHTML=notifStore.map(n=>'<div class="notif-item'+(n.read?"":" unread")+'"><span class="ic">'+esc(n.icon)+'</span><div class="body"><div class="txt">'+esc(n.text)+'</div><div class="ts">'+esc(notifFmtTs(n.ts))+'</div></div></div>').join("");
}
function notifMarkAllRead(){
  let changed=false;
  notifStore.forEach(n=>{ if(!n.read){ n.read=true; changed=true; } });
  if(changed){ notifSave(); notifRenderBadge(); notifRenderList(); }
}
function notifOpen(){
  const panel=document.getElementById("notifPanel"), btn=document.getElementById("notifBell");
  if(!panel||!btn) return;
  const r=btn.getBoundingClientRect();
  panel.style.top=(r.bottom+8)+"px";
  panel.style.right=Math.max(8,window.innerWidth-r.right)+"px";
  notifRenderList();
  panel.classList.add("on");
  btn.setAttribute("aria-expanded","true");
  notifMarkAllRead();
  document.addEventListener("mousedown",notifOutsideClick,true);
}
function notifClose(){
  const panel=document.getElementById("notifPanel"), btn=document.getElementById("notifBell");
  if(panel) panel.classList.remove("on");
  if(btn) btn.setAttribute("aria-expanded","false");
  document.removeEventListener("mousedown",notifOutsideClick,true);
}
function notifOutsideClick(e){
  const panel=document.getElementById("notifPanel"), btn=document.getElementById("notifBell");
  if(!panel) return;
  if(panel.contains(e.target)||(btn&&btn.contains(e.target))) return;
  notifClose();
}
function notifToggle(){
  const panel=document.getElementById("notifPanel");
  if(panel&&panel.classList.contains("on")) notifClose(); else notifOpen();
}
notifRenderBadge();

let toEl=null;
function toast(t){ notifAdd(t); if(!toEl){toEl=document.createElement("div");toEl.style.cssText="position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--glass-3);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--hair);color:var(--text);padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:99;box-shadow:var(--shadow);transition:opacity .3s";document.body.appendChild(toEl);} toEl.textContent=t; toEl.style.opacity="1"; clearTimeout(toEl._t); toEl._t=setTimeout(()=>toEl.style.opacity="0",2600); }

const _mq=matchMedia("(prefers-color-scheme:dark)");
function applyTheme(){
  const t=localStorage.getItem("prontera_theme")||"auto";
  const dark = t==="dark" || (t==="auto" && _mq.matches);
  document.documentElement.setAttribute("data-theme", dark?"dark":"light");
  const btn=document.getElementById("themeBtn");
  if(btn){ btn.innerHTML=ic(t==="auto"?"auto":dark?"moon":"sun"); btn.title="ธีม: "+t+" (คลิกเพื่อสลับ)"; }
}
function cycleTheme(){ const cur=localStorage.getItem("prontera_theme")||"auto"; const nx={auto:"light",light:"dark",dark:"auto"}[cur]; localStorage.setItem("prontera_theme",nx); applyTheme(); toast("ธีม: "+nx); }
_mq.addEventListener("change",()=>{ if((localStorage.getItem("prontera_theme")||"auto")==="auto") applyTheme(); });

/* ── command palette (⌘K / Ctrl+K) — jump targets reuse the same NAV array that builds #nav/#mnav, so this list can never drift out of sync. m2: /history_search results are wired in as a second, debounced group below the (still-instant) NAV matches. */
let cmdkItems=NAV.slice(), cmdkSel=0;
let cmdkHistItems=[], cmdkHistQuery="", cmdkHistTimer=null, cmdkHistReq=0;
let pendingSearchQuery=null; // set by a history-result activation; renderSearch() consumes it on entry
function cmdkMatch(n,q){ if(!q) return true; q=q.toLowerCase(); return n[1].toLowerCase().indexOf(q)>=0 || n[0].toLowerCase().indexOf(q)>=0; }
function cmdkItemHtml(it,i){
  const sel=i===cmdkSel?" sel":"";
  if(it.kind==="hist"){
    const r=it.r, snip=(r.snippet||"").slice(0,90);
    return '<div class="cmdk-item hist'+sel+'" data-i="'+i+'"><div class="hh"><b>'+esc(r.title||"")+'</b><span class="chip">'+esc(r.kind||"")+'</span></div>'+(snip?'<div class="hs">'+esc(snip)+'</div>':'')+'</div>';
  }
  return '<div class="cmdk-item'+sel+'" data-i="'+i+'">'+ic(it.icon)+'<span>'+esc(it.label)+'</span></div>';
}
function cmdkRenderList(){
  const list=document.getElementById("cmdkList"); const q=(document.getElementById("cmdkInput").value||"").trim();
  const navMatches=NAV.concat(NAV_HIDDEN).filter(n=>cmdkMatch(n,q)).map(n=>({kind:"nav",id:n[0],label:n[1],icon:n[2]}));
  const histMatches=cmdkHistItems.map(r=>({kind:"hist",r:r}));
  cmdkItems=navMatches.concat(histMatches);
  if(!cmdkItems.length){ list.innerHTML='<div class="cmdk-empty">ไม่พบหัวข้อที่ตรงกับ "'+esc(q)+'"</div>'; return; }
  if(cmdkSel>=cmdkItems.length) cmdkSel=0;
  let html=navMatches.map((it,i)=>cmdkItemHtml(it,i)).join("");
  if(histMatches.length) html+='<div class="cmdk-group">ประวัติงาน</div>'+histMatches.map((it,i)=>cmdkItemHtml(it,navMatches.length+i)).join("");
  list.innerHTML=html;
  list.querySelectorAll(".cmdk-item").forEach(el=>{
    el.onmousedown=e=>e.preventDefault(); // keep focus on input
    el.onclick=()=>cmdkActivate(parseInt(el.dataset.i,10));
    el.onmouseenter=()=>{ cmdkSel=parseInt(el.dataset.i,10); cmdkUpdateSel(); };
  });
}
async function cmdkRunHistFetch(q){
  const myReq=++cmdkHistReq;
  const d=await getJSON("/history_search?q="+encodeURIComponent(q)+"&limit=6");
  if(myReq!==cmdkHistReq) return; // a newer request started while this one was in flight — drop it
  cmdkHistItems=Array.isArray(d)?d.slice(0,6):[];
  cmdkHistQuery=q;
  cmdkRenderList();
}
function cmdkRender(){
  const q=(document.getElementById("cmdkInput").value||"").trim();
  if(cmdkHistTimer){ clearTimeout(cmdkHistTimer); cmdkHistTimer=null; }
  if(q!==cmdkHistQuery){ cmdkHistItems=[]; } // stale results from a previous query — clear immediately, instant NAV filter is unaffected
  cmdkRenderList(); // NAV filtering stays synchronous/instant
  if(q.length>=2) cmdkHistTimer=setTimeout(()=>cmdkRunHistFetch(q),200);
}
function cmdkUpdateSel(){
  document.querySelectorAll(".cmdk-item").forEach(el=>el.classList.toggle("sel",parseInt(el.dataset.i,10)===cmdkSel));
  const sel=document.querySelector(".cmdk-item.sel"); if(sel) sel.scrollIntoView({block:"nearest"});
}
function cmdkActivate(i){
  const it=cmdkItems[i]; if(!it) return;
  if(it.kind==="hist"){
    const q=cmdkHistQuery;
    cmdkClose();
    pendingSearchQuery=q;
    go("search");
    return;
  }
  go(it.id); cmdkClose();
}
function cmdkOpen(){
  const ov=document.getElementById("cmdkOverlay"); if(ov.classList.contains("on")) return;
  ov.classList.add("on"); cmdkSel=0;
  const inp=document.getElementById("cmdkInput"); inp.value="";
  if(cmdkHistTimer){ clearTimeout(cmdkHistTimer); cmdkHistTimer=null; }
  cmdkHistItems=[]; cmdkHistQuery=""; cmdkHistReq++;
  cmdkRenderList(); setTimeout(()=>inp.focus(),0);
}
function cmdkClose(){
  const ov=document.getElementById("cmdkOverlay"); if(!ov.classList.contains("on")) return;
  ov.classList.remove("on"); document.getElementById("cmdkInput").blur();
  if(cmdkHistTimer){ clearTimeout(cmdkHistTimer); cmdkHistTimer=null; }
}
function cmdkIsTyping(el){
  if(!el) return false; const tag=(el.tagName||"").toLowerCase();
  return tag==="input"||tag==="textarea"||tag==="select"||el.isContentEditable;
}
document.getElementById("cmdkInput").addEventListener("input",()=>{ cmdkSel=0; cmdkRender(); });
document.getElementById("cmdkInput").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){ e.preventDefault(); if(cmdkItems.length) cmdkSel=Math.min(cmdkSel+1,cmdkItems.length-1); cmdkUpdateSel(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); if(cmdkItems.length) cmdkSel=Math.max(cmdkSel-1,0); cmdkUpdateSel(); }
  else if(e.key==="Enter"){ e.preventDefault(); cmdkActivate(cmdkSel); }
  else if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); cmdkClose(); }
});
document.getElementById("cmdkOverlay").addEventListener("mousedown",e=>{ if(e.target.id==="cmdkOverlay") cmdkClose(); });
document.getElementById("cmdkOpenBtn").onclick=cmdkOpen;
document.addEventListener("keydown",e=>{
  const overlay=document.getElementById("cmdkOverlay"), isOpen=overlay.classList.contains("on");
  if((e.metaKey||e.ctrlKey)&&(e.key==="k"||e.key==="K")){
    // never hijack normal typing (#say, #hq, or any other text field) unless the palette itself is already open
    if(!isOpen && cmdkIsTyping(document.activeElement)) return;
    e.preventDefault();
    if(isOpen) cmdkClose(); else cmdkOpen();
    return;
  }
  if(e.key==="Escape"&&isOpen){ cmdkClose(); }
  if(e.key==="Escape"){ const np=document.getElementById("notifPanel"); if(np&&np.classList.contains("on")) notifClose(); }
});

applyTheme();
buildNav();
document.getElementById("themeBtn").onclick=cycleTheme;
document.getElementById("notifBell").onclick=e=>{ e.stopPropagation(); notifToggle(); };
document.getElementById("notifMarkAll").onclick=e=>{ e.stopPropagation(); notifMarkAllRead(); };
go("overview"); refreshTokens(); setInterval(refreshTokens,30000);
pollActivityGlobal(); setInterval(pollActivityGlobal,6000);
</script>
